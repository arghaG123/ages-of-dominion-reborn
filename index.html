<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ages of Dominion</title>
<link rel="stylesheet" href="src/client/game.css">
</head>
<body>
<input id="import-file" type="file" accept="application/json,.json" hidden aria-label="Import campaign file">
<input id="challenge-file" type="file" accept="application/json,.json" hidden aria-label="Import challenge file">
<div id="rotate">Rotate to landscape to play. Your campaign stays saved.</div>
<main id="app">
  <header>
    <h1>Ages of Dominion</h1>
    <span id="status" role="status"></span>
    <div id="resources" aria-label="Campaign resources"></div>
    <p id="resume" role="status" hidden></p>
    <button id="context" type="button" aria-expanded="false" aria-controls="panel">All actions</button>
    <button id="save" type="button">Save</button>
  </header>
  <section id="stage">
    <div id="frame">
      <img id="terrain" alt="">
      <svg id="world" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Campaign scene"></svg>
    </div>
    <div id="labels" aria-hidden="true"></div>
    <div id="gate" hidden>
      <div id="gate-copy">
        <p id="gate-kicker">Stone valley</p>
        <h2 id="gate-title">Ages of Dominion</h2>
        <p id="gate-line"></p>
      </div>
      <div id="gate-actions" aria-label="Campaign gate"></div>
    </div>
    <div id="dock" aria-label="Primary actions"></div>
    <div id="retreat" role="dialog" aria-modal="true" aria-labelledby="retreat-title" hidden>
      <h2 id="retreat-title">Retreat</h2>
      <p id="retreat-body"></p>
      <div>
        <button type="button" id="retreat-cancel" data-choice="retreat-cancel">Cancel</button>
        <button type="button" id="retreat-confirm" data-choice="retreat-confirm">Confirm retreat</button>
      </div>
    </div>
    <aside id="panel">
      <h2 id="selected">Kingdom</h2>
      <div id="choices"></div>
      <p id="message" role="alert"></p>
    </aside>
  </section>
  <footer>
    <nav id="nav" aria-label="Screens"></nav>
  </footer>
</main>
<script type="module" src="src/client/main.js"></script>
</body>
</html>
