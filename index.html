<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ages of Dominion</title>
<link rel="stylesheet" href="src/client/game.css">
</head>
<body>
<div id="rotate">Rotate to landscape to play. Your campaign stays saved.</div>
<main id="app">
  <header>
    <h1>Ages of Dominion</h1>
    <span id="status" role="status"></span>
    <div id="resources" aria-label="Campaign resources"></div>
    <button id="save" type="button">Save</button>
  </header>
  <section id="stage">
    <div id="frame">
      <img id="terrain" alt="">
      <svg id="world" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Campaign scene"></svg>
    </div>
    <button id="context" type="button" aria-expanded="false" aria-controls="panel">Actions</button>
    <aside id="panel">
      <h2 id="selected">Kingdom</h2>
      <div id="choices"></div>
      <p id="message" role="alert"></p>
    </aside>
  </section>
  <footer>
    <nav id="nav" aria-label="Screens"></nav>
  </footer>
</main>
<script type="module" src="src/client/main.js"></script>
</body>
</html>
