plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agesofdominion.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.agesofdominion.game.reborn.preview'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {}
