plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agesofdominion.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.agesofdominion.game.reborn.preview'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // Distinct package filename per build type so a rebuild never silently replaces an older
    // package under the generic app-release-unsigned.apk name.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "ages-of-dominion-reborn-preview-${variant.buildType.name}-unsigned-20261011.apk"
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
